# nginx site for nanybot.com (Laravel 12).
# Install: copy to /etc/nginx/sites-available/nanybot.com, symlink into
# sites-enabled, and copy security-headers.conf to
# /etc/nginx/snippets/nanybot-security-headers.conf (or fix the include paths).
# Adjust APP_ROOT, the PHP-FPM socket and the TLS certificate paths.
#
# Static page cache (see app/Services/Blog/PageCache.php):
#   /                    -> public/page-cache/index.html
#   /blog                -> public/page-cache/blog.html
#   /blog/page/2         -> public/page-cache/blog/page/2.html
#   /blog/my-post        -> public/page-cache/blog/my-post.html
#   /blog/my-post.md     -> public/page-cache/blog/my-post.md   (extension kept)
#   /sitemap.xml, /robots.txt, /llms.txt, /blog/feed.xml  (extension kept)
# Only GET/HEAD requests with NO query string are ever written, so the same
# rules apply here: anything with "?..." (e.g. /blog/search?q=) goes to PHP.
# /admin/* and /api/* are never served from the cache.

# ---- http-level maps (this file is included inside http {}) -----------------

# "/page-cache" when this request may be answered from the static cache,
# otherwise a directory that does not exist. $request_method$is_args$uri looks
# like "GET/blog" (no query) or "GET?/blog" (query) -> the latter never matches.
map "$request_method$is_args$uri" $nanybot_cache_root {
    default                                                          /nocache;
    "~^(GET|HEAD)/(?!(admin|api|up|login|logout|register|settings|two-factor|forgot-password|reset-password|confirm-password|email|user|storage|page-cache)(/|$))" /page-cache;
}

# ---- HTTP -> HTTPS ------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name nanybot.com www.nanybot.com;
    return 301 https://nanybot.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.nanybot.com;

    ssl_certificate     /etc/letsencrypt/live/nanybot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nanybot.com/privkey.pem;
    return 301 https://nanybot.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nanybot.com;

    ssl_certificate     /etc/letsencrypt/live/nanybot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nanybot.com/privkey.pem;

    root /var/www/nanybot.com/public;   # APP_ROOT/public
    index index.php;
    charset utf-8;
    # Webhook bodies are HTML articles.
    client_max_body_size 8m;

    include /etc/nginx/snippets/nanybot-security-headers.conf;

    # ---- MIME types ---------------------------------------------------------
    # mime.types is itself a `types { }` block (and a `types` here replaces the
    # inherited one), so include it first, then add .md in a second block.
    include mime.types;
    types {
        text/markdown md;
    }
    charset_types text/plain text/markdown text/css text/xml application/xml
                  application/rss+xml application/javascript application/json image/svg+xml;

    # ---- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/markdown text/xml application/xml application/rss+xml
               application/json application/javascript image/svg+xml;

    # ---- Never expose dotfiles (allow ACME challenges) ----------------------
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # ---- The cache directory is an implementation detail --------------------
    location ^~ /page-cache/ {
        return 404;
    }

    # ---- Fingerprinted Vite assets: cache forever ---------------------------
    location ^~ /build/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/nanybot-security-headers.conf;
        try_files $uri =404;
    }

    # ---- Other static files in public/ --------------------------------------
    location ~* ^/(favicon\.ico|favicon\.svg|logo\.png|apple-touch-icon\.png)$ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/snippets/nanybot-security-headers.conf;
        try_files $uri =404;
    }

    # ---- Home page: cached file or PHP --------------------------------------
    location = / {
        add_header Cache-Control "public, max-age=60, s-maxage=600, stale-while-revalidate=86400" always;
        include /etc/nginx/snippets/nanybot-security-headers.conf;
        try_files $nanybot_cache_root/index.html @php;
    }

    # ---- Everything else: static cache first, then Laravel ------------------
    #   1. /page-cache$uri         exact file  (sitemap.xml, post.md, feed.xml ...)
    #   2. /page-cache$uri.html    page        (/blog -> blog.html)
    #   3. $uri                    any other real file in public/
    #   4. @php                    Laravel
    location / {
        add_header Cache-Control "public, max-age=60, s-maxage=600, stale-while-revalidate=86400" always;
        include /etc/nginx/snippets/nanybot-security-headers.conf;
        try_files $nanybot_cache_root$uri $nanybot_cache_root$uri.html $uri @php;
    }

    # ---- PHP-FPM (index.php front controller only) --------------------------
    location @php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Direct requests to any .php file are not allowed.
    location ~ \.php$ {
        return 404;
    }

    access_log /var/log/nginx/nanybot.com.access.log;
    error_log  /var/log/nginx/nanybot.com.error.log;
}

